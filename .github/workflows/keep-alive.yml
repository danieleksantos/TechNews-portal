name: Supabase Keep Alive

on:
  schedule:
    # Isso vai rodar todos os dias à meia-noite (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite que você rode manualmente se quiser testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ping Supabase API
        run: |
          curl -I https://tech-news-portal.vercel.app/